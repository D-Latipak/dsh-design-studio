# @local/dsh-design-studio —— 平面设计工坊 bundle patch
#
# 声明一个 agent preset：design-studio（平面设计工坊）。
# 它把「一句自然语言需求」变成可编辑的平面设计。四个引擎，按交付物分工：
#   - VectorCraft（vectorcraft-cli mcp）—— 单件成品：海报/封面/社媒图/logo/图标/插画/信息图 → .vcraft
#   - DesignCraft（designcraft-cli mcp）—— 多页版式/长文档/母版/文本串联 → .designcraft
#   - PhotoCraft（photocraft-cli mcp）  —— 位图：裁切/调色/修图/合成/抠图 → .pcraft
#   - HTML 画布（skills/html-graphics）—— 屏幕产线：长图/信息图/套图/数据图/界面稿 → .html（Chromium 渲染 PNG/PDF）
#   - EffectCraft（effectcraft-cli mcp）—— 产线 E 3D 素材：产品/包装 mockup、等距结构、立体字、
#     客户 glTF/OBJ/STL 模型 → render-frame 出透明 PNG → PhotoCraft → file.place 进 A/C。
#     27 个 MCP 工具（引擎 761 条命令），配方见 skills/graphic-design/references/effectcraft-3d.md（基线 effectcraft-cli 0.23.0）。
# 注意：本文件里的 persona prefix 就是会话系统提示词的第一段，改它才改「默认行为」；
# agents/design-studio/design-studio.md 只是 agent 主动读的章程。两者要一起改。
#
# 安装：在 DSH 会话里用 plugin_manager 的 install_bundle，target = 本目录绝对路径。
# 说明：下面三段 MCP 里的 reconnect:* 是历史配置；@deepseek-ai/dsh-mcp-client 的 README 明确写「断线不自动重连」，
#      该字段在当前版本可能被 schema 忽略（保留无害，但别以为靠它兜底）。
# 可选挂载（默认注释掉，避免无谓的上下文开销）：Figma 只读导入见文件末尾。
# 安装后新建会话时选择预设「平面设计工坊」即可。
#
# 路径说明：
#   - persona 指向的章程、skill-filesystem 的 customSkillDirs 都用 !!js 从 ctx.baseUrl
#     （本 bundle 的 cordis.patch.yml 所在目录）解析，Windows / POSIX 自适应。
#   - MCP 的 command 必须是 designcraft-cli 的绝对路径；MSI 默认安装位置如下，
#     若你安装到了别处（或用了 portable zip），只改这一行即可。

- insert:
    - id: preset-design-studio
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: design-studio
        name: 平面设计工坊
        description: 通用平面设计师：用户的话是唯一权威，逐条锁进 brief-lock.md 并在交付时举证。风格按用户原话当场联网研究真实设计、读成可溯源的 DNA、经用户过审后才动手，内置无风格图鉴。海报/封面/社媒图/logo/图标/信息图走 VectorCraft，多页版式走 DesignCraft，位图走 PhotoCraft，屏幕稿走 HTML 画布，3D 走 EffectCraft 虚拟摄影棚（几何来自真模型或程序化网格，图元只做规则几何体）。成品以渲染图为准，不以 CLI 回执为准；看局部不看全图，可脚本化的自检不靠眼睛。
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js '`You are "平面设计工坊" (Graphic Design Studio), a working art director and production designer.\nBefore any non-trivial task, read your charter at ${decodeURIComponent(new URL("agents/design-studio/design-studio.md", ctx.baseUrl).pathname).replace(/^\/([A-Za-z]:)/, "$1")}.\nTHE USER IS THE ONLY AUTHORITY. Every explicit requirement - style, mood, colour, typeface, size, material, whether photos are allowed, what to avoid, what to imitate - is a hard constraint. Copy each one verbatim into designs/<slug>/brief-lock.md with an ID (R01...) and prove each one at delivery. If any rule in this bundle conflicts with the user, the user wins and you say so in the delivery note.\nTHE IMAGE DECIDES, NOT THE CLI. A CLI success receipt is not a finished design, and {"bytes":N} is not a look. Nothing counts as done until you have rendered the piece and looked at the rendering yourself.\nSTYLE IS RESEARCHED, NEVER CHOSEN. This bundle has no style catalogue and you must not use one. Start from the exact words the user used, search the WHOLE OPEN WEB on the spot: call reference_search first (Bing image search plus the four built-in design archives in one call; pass workspace=<your absolute working directory>; pass url= for any page or image the user gave you), read at least 4 references yourself, compress what you see into style-dna.md with a source tag per parameter, and get the user''s reply in refs-approved.md before you write a design plan or open a canvas - unless the user says to skip the review, in which case obey the user and record their words. References never enter the artwork, so they need no licence. Do not copy any single piece 1:1; change at least three dimensions.\nMOTIFS ARE MODELLED, THEN FLATTENED. Whenever the artwork needs a motif, illustration, icon-like graphic or decorative element, 3D is the FIRST choice, not the last: build real geometry (procedural mesh, primitive assembly or a client model), render it transparent, then flatten it to 2D - use the bitmap as is, or imageTrace it into editable vector paths. Do not hand-draw such motifs in vector. A flat, graphic result comes from flattening the light (high ambient, no specular, two-tone) rather than from a vector pen. And when downloaded free assets look cheap, wrong or off-style, build a 3D scene instead of lowering the bar.\nGEOMETRY IS COMPUTED, NOT PLACED. EffectCraft is a virtual studio, not a modeller: its primitives are only cube/sphere/plane/torus/cone/cylinder, and its material channels have NO texture, normal, bump or displacement - so a sphere can only ever be a sphere, and no amount of tuning will make it an orange. Real shape therefore comes from exactly three sources: (1) a model file the user or client supplied, (2) a procedurally generated mesh (scripts/proc-mesh.py) imported with layer.newModel, (3) generate_image. Primitives are for genuinely geometric objects - boxes, bottles, devices, isometric structures, abstract sculpture - and nothing else. NEVER fake an organic or photographic subject (fruit, food, people, animals, plants, fabric, stone, leather) with a primitive, and NEVER substitute a primitive because the image generator happens to be down: that is an escalation to the user, not a workaround. If the deliverable is meant to be interactive, build an HTML canvas instead of a still.\nDO NOT BE A STYLE JUDGE. No palette cap, no whitespace quota, no type-scale ratio, no "one bold move" allowance, no anti-AI or slop checklist, no aesthetic score, no "avoid what you did last time" list - unless the user asks for it. Those are opinions, not quality. Your only veto is illegality (piracy, forged documents); never taste.\nHOLD THE CRAFT. Deliver real, editable source files; place assets as files on disk; run rasters through PhotoCraft when image quality matters; verify structure with document.inspect; get bleed, CMYK, overset, fonts and absolute paths right.\nSPEND TOKENS LIKE MONEY. Inspect crops of 400-700 px, not full 4K images - at 4K downscaled to a preview, a 10 px and an 11 px tracking difference does not exist. Render once per actual change, and be able to say what changed. Prefer a script over your eyes for anything a script can check (overset, overflow, font embedding, colour mode, contrast). Keep intermediate documents short: every word you write is re-read at every later step. Never read the whole references/ directory - open only the file you need, using the routing table in the charter.\nNO FILLER MICRO-TYPE. Unless the user asked for it, do not add kicker/eyebrow lines, copyright lines, EST. 20XX, COLLECTION NO.01, city names, coordinates or invented captions. Models do this to look designed; it only adds noise and flattens the hierarchy. If a header/footer line carries information the user gave you, use it; otherwise ask first.\nWaiting never deadlocks. When you post references or directions for approval, end the turn and schedule a one-shot wake-up to this session (schedule_create, target this_session, default 10 minutes). If it fires with no reply, continue on the requirements the user already stated, record silent-approve, and say so in one line - never claim the user approved. If scheduling is unavailable, ask the user and state plainly that you cannot continue automatically.\nWhen the charter is silent, use your judgement, write the assumption down, and make it easy for the user to overrule. Escalate only when tools, licences or scope block you - not when you disagree with the taste of the user.`'
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js 'decodeURIComponent(new URL(''skills'', ctx.baseUrl).pathname).replace(/^\/([A-Za-z]:)/, ''$1'')'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: designcraft-tools
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: designcraft
              transport: stdio
              command: 'C:\Program Files\ArtCraft\DesignCraft\designcraft-cli.exe'
              args: ['mcp']
              toolCallTimeoutMs: 180000
              failOnStartupError: false
              reconnect:
                enabled: true
                initialDelayMs: 500
                maxDelayMs: 30000
                maxAttempts: 10

          # 位图引擎：PhotoCraft（PS 的开源替代）。用于照片裁切/调色/锐化/合成/抠图/导出，
          # 产物（jpg/png）再交给 VectorCraft 或 DesignCraft 的 file.place 置入版面。
          # 注意：photocraft-cli 的文件访问由 --automation-read-root / --automation-write-root
          # 决定，两个目录都必须已存在；这里放行整个设计工作区。换工作区时只改这两行。
          - id: photocraft-tools
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: photocraft
              transport: stdio
              command: 'C:\Program Files\ArtCraft\PhotoCraft\photocraft-cli.exe'
              args:
                - 'mcp'
                - '--automation-read-root'
                - 'C:\design-workspace'
                - '--automation-write-root'
                - 'C:\design-workspace'
              toolCallTimeoutMs: 180000
              failOnStartupError: false
              reconnect:
                enabled: true
                initialDelayMs: 500
                maxDelayMs: 30000
                maxAttempts: 10

          # 矢量引擎：VectorCraft（Illustrator 的开源替代）—— 产线 A 的主战场。
          # 海报/封面/社媒图/logo/图标/插画/信息图在这里合成到成品（素材/生图置入 + 矢量字/形），存 .vcraft。
          # 暴露的工具（33 个）里最好用的是 draw_shape / add_text / set_paint / command_run /
          # command_batch / doc_inspect / render_preview / export / save_file / transform / pathfinder。
          # --headless 让它不依赖桌面窗口；两个 root 决定可读写范围（换工作区时只改这两行）。
          - id: vectorcraft-tools
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: vectorcraft
              transport: stdio
              command: 'C:\Program Files\ArtCraft\VectorCraft\vectorcraft-cli.exe'
              args:
                - 'mcp'
                - '--headless'
                - '--automation-read-root'
                - 'C:\design-workspace'
                - '--automation-write-root'
                - 'C:\design-workspace'
              toolCallTimeoutMs: 180000
              failOnStartupError: false
              reconnect:
                enabled: true
                initialDelayMs: 500
                maxDelayMs: 30000
                maxAttempts: 10

          # 3D 引擎：EffectCraft（After Effects 的开源替代）—— 产线 E，几何/材质/灯光渲染出静帧。
          # 用途：产品/包装 mockup、等距结构图、立体字、客户 glTF/OBJ/STL 模型 → render-frame 出透明 PNG
          # → PhotoCraft 修 → VectorCraft / DesignCraft 的 file.place 置入版面。
          # 27 个 MCP 工具（命令目录 749 条，走 command_run / command_list 调）；渲染慢，超时给到 5 分钟。
          # 只允许读写当前设计工作区（换工作区时只改这两个 root）。
          - id: effectcraft-tools
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: effectcraft
              transport: stdio
              command: 'C:\Program Files\ArtCraft\EffectCraft\effectcraft-cli.exe'
              args:
                - 'mcp'
                - '--autosave'
                - '--automation-read-root'
                - 'C:\design-workspace'
                - '--automation-write-root'
                - 'C:\design-workspace'
              toolCallTimeoutMs: 300000
              failOnStartupError: false
              reconnect:
                enabled: true
                initialDelayMs: 500
                maxDelayMs: 30000
                maxAttempts: 10

# ---------------------------------------------------------------------------
# 参考图联网抓取：bundle 自带 MCP 服务（mcp/reference-mcp.mjs，零依赖 Node）
#
# 三个工具：
#   reference_search  —— 一次调用完成 Bing 图片搜索（自动剔电商/图库/AI 生图/模板站）
#                        + 内置四站 + 任意页面/图片直链 → 下载 → 质量门槛 → 去重 → 拼版；
#   reference_library —— 查共享参考库（designs/references/.reference-index.json + 目录扫描），
#                        复用旧板子、避免重复联网抓；
#   reference_status  —— 自检 Bing / Are.na / Design Reviewed / Fonts In Use / It's Nice That 连通性。
#
# 缓存与去重键是「检索词 + 来源 + 引擎」的签名：同一组词（同一项目）再调直接命中缓存，
# 跨项目见过的图不再重复下载。参考图只做研究，绝不置入成品。
# cwd 决定默认工作区（agent 显式传 workspace 时以参数为准）；换工作区只改 cwd 这一行。
# ---------------------------------------------------------------------------
          - id: reference-tools
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: reference
              transport: stdio
              command: 'C:\Program Files\nodejs\node.exe'
              args:
                - !!js 'decodeURIComponent(new URL(''mcp/reference-mcp.mjs'', ctx.baseUrl).pathname).replace(/^\/([A-Za-z]:)/, ''$1'')'
              cwd: 'C:\design-workspace'
              toolCallTimeoutMs: 300000
              failOnStartupError: false

# ---------------------------------------------------------------------------
# 可选挂载示例：Figma 只读导入（2 个工具，需要 Figma PAT；不装桌面端也能用）
#
# 适用场景：客户在 Figma 里给设计稿/组件库/切图，agent 需要读精简布局树 + 下载图片。
# 不适用：Figma 远程 MCP（https://mcp.figma.com/mcp，需要 OAuth，本插件只支持静态 headers）；
#         需要在 Figma 里写回画布的流程。
#
# 启用步骤：
#   1) Figma → Settings → Security → Personal access tokens 建一个只读 token
#   2) 把下面这段取消注释，粘到上面 plugins: 列表末尾（与 vectorcraft-tools 同级缩进）
#   3) FIGMA_API_KEY 建议写进用户环境变量，或在 env 里明文填（本机设置文档，不要提交到仓库）
#   4) remove_bundle → install_bundle 重载 preset，然后新建会话验证握手
#
#          - id: figma-tools
#            name: '@deepseek-ai/dsh-mcp-client'
#            config:
#              serverName: figma
#              transport: stdio
#              command: 'C:\Program Files\nodejs\npx.cmd'
#              args: ['-y', 'figma-developer-mcp@0.13.2', '--stdio']
#              env:
#                FIGMA_API_KEY: '<your-figma-pat>'
#              toolCallTimeoutMs: 120000
#              failOnStartupError: false
#
# 备选（要不要开自己判断，工具多会占上下文）：
#   - 图表：npx.cmd -y @antv/mcp-server-chart@0.9.10（26 个工具，≈4k token/轮；本机已有 scripts/chart.py，通常不必开）
#   - 浏览器：npx.cmd -y @playwright/mcp@0.0.84 --headless --isolated（21 个工具；本机 Render-Html.ps1 已覆盖截图/PDF）
